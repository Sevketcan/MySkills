name: Validate skill collection

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Validate skills and manifest
        run: |
          python scripts/validate_collection.py
          python scripts/build_manifest.py
          git diff --exit-code -- manifest.json
      - name: Check scripts
        run: |
          bash -n install.sh
          bash -n scripts/export-local.sh
          bash -n scripts/auto-sync.sh
          bash -n scripts/install-macos-autosync.sh
          bash -n scripts/uninstall-macos-autosync.sh
          python -m py_compile scripts/build_manifest.py scripts/validate_collection.py skills/game-balance-lab/scripts/balance_lab.py
      - name: Test idempotent installation
        run: |
          export CODEX_HOME="$RUNNER_TEMP/codex-test"
          expected_packages="$(find skills -mindepth 2 -maxdepth 2 -type f -name SKILL.md | wc -l | tr -d ' ')"
          ./install.sh | tee "$RUNNER_TEMP/first.log"
          ./install.sh | tee "$RUNNER_TEMP/second.log"
          grep -q "${expected_packages} installed" "$RUNNER_TEMP/first.log"
          grep -q "${expected_packages} unchanged" "$RUNNER_TEMP/second.log"
      - name: Test idempotent Claude Code installation
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-test"
          total_packages="$(find skills -mindepth 2 -maxdepth 2 -type f -name SKILL.md | wc -l | tr -d ' ')"
          ./install.sh --target claude | tee "$RUNNER_TEMP/claude-first.log"
          ./install.sh --target claude | tee "$RUNNER_TEMP/claude-second.log"
          skipped="$(grep -c '^skipped' "$RUNNER_TEMP/claude-first.log" || true)"
          expected_packages="$((total_packages - skipped))"
          grep -q "${expected_packages} installed" "$RUNNER_TEMP/claude-first.log"
          grep -q "${expected_packages} unchanged" "$RUNNER_TEMP/claude-second.log"
      - name: Check Claude Code compatibility of the installed tree
        run: |
          claude_skills="$RUNNER_TEMP/claude-test/skills"
          # YAML list frontmatter is rewritten into the comma-separated form.
          grep -qx 'allowed-tools: Bash' "$claude_skills/unity-cli/SKILL.md"
          grep -qx 'allowed-tools: Bash, Read, Write, Edit' "$claude_skills/unity-package-management/SKILL.md"
          # Codex-only leftovers must not reach the Claude skills directory.
          test ! -e "$claude_skills/unity-skills~"
          test -z "$(find "$claude_skills" -type d -name agents)"
          test -z "$(grep -rl 'CODEX_HOME' "$claude_skills" || true)"
          # Every installed package must still carry a readable entry point.
          test "$(find "$claude_skills" -mindepth 2 -maxdepth 2 -type f -name SKILL.md | wc -l | tr -d ' ')" -gt 0
      - name: Test --all override for skipped packages
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-all"
          total_packages="$(find skills -mindepth 2 -maxdepth 2 -type f -name SKILL.md | wc -l | tr -d ' ')"
          ./install.sh --target claude --all | tee "$RUNNER_TEMP/claude-all.log"
          grep -q "${total_packages} installed" "$RUNNER_TEMP/claude-all.log"
          test -f "$CLAUDE_CONFIG_DIR/skills/unity-skills/SKILL.md"
          test -f "$CLAUDE_CONFIG_DIR/skills/fullstack-dev/SKILL.md"
      - name: Test automatic export, commit, and push
        run: |
          git config user.name "MySkills CI"
          git config user.email "myskills-ci@users.noreply.github.com"
          git init --bare "$RUNNER_TEMP/remote.git"
          git push "$RUNNER_TEMP/remote.git" HEAD:main
          git remote set-url origin "$RUNNER_TEMP/remote.git"
          export CODEX_HOME="$RUNNER_TEMP/autosync-codex"
          ./install.sh >/dev/null
          touch "$CODEX_HOME/skills/gdd-studio/autosync-ci.test"
          MYSKILLS_STATE_ROOT="$RUNNER_TEMP/autosync-state" \
          MYSKILLS_VALIDATOR_PYTHON="$(command -v python)" \
          ./scripts/auto-sync.sh | tee "$RUNNER_TEMP/autosync.log"
          grep -q 'pushed 1 commit' "$RUNNER_TEMP/autosync.log"
          git --git-dir="$RUNNER_TEMP/remote.git" show main:skills/gdd-studio/autosync-ci.test >/dev/null

  windows-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test idempotent PowerShell installation
        shell: pwsh
        run: |
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP "codex-test"
          $expectedPackages = (Get-ChildItem -Path skills -Directory | Where-Object { Test-Path (Join-Path $_.FullName "SKILL.md") }).Count
          ./install.ps1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP "first.log")
          ./install.ps1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP "second.log")
          if (-not (Select-String -Quiet -Path (Join-Path $env:RUNNER_TEMP "first.log") -Pattern "$expectedPackages installed")) { throw "First install count mismatch" }
          if (-not (Select-String -Quiet -Path (Join-Path $env:RUNNER_TEMP "second.log") -Pattern "$expectedPackages unchanged")) { throw "Second install was not idempotent" }
      - name: Test idempotent PowerShell installation for Claude Code
        shell: pwsh
        run: |
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "claude-test"
          $totalPackages = (Get-ChildItem -Path skills -Directory | Where-Object { Test-Path (Join-Path $_.FullName "SKILL.md") }).Count
          $firstLog = Join-Path $env:RUNNER_TEMP "claude-first.log"
          $secondLog = Join-Path $env:RUNNER_TEMP "claude-second.log"
          ./install.ps1 -Target claude | Tee-Object -FilePath $firstLog
          ./install.ps1 -Target claude | Tee-Object -FilePath $secondLog
          $skipped = (Select-String -Path $firstLog -Pattern "^skipped").Count
          $expectedPackages = $totalPackages - $skipped
          if (-not (Select-String -Quiet -Path $firstLog -Pattern "$expectedPackages installed")) { throw "Claude install count mismatch" }
          if (-not (Select-String -Quiet -Path $secondLog -Pattern "$expectedPackages unchanged")) { throw "Claude install was not idempotent" }
          $claudeSkills = Join-Path $env:CLAUDE_CONFIG_DIR "skills"
          if (-not (Select-String -Quiet -Path (Join-Path $claudeSkills "unity-cli/SKILL.md") -Pattern "^allowed-tools: Bash$")) { throw "allowed-tools was not converted" }
          if (Test-Path (Join-Path $claudeSkills "unity-skills~")) { throw "Codex-only directory name reached the Claude skills directory" }
          if (Get-ChildItem -Path $claudeSkills -Directory -Recurse -Filter "agents") { throw "Codex agent manifests reached the Claude skills directory" }
